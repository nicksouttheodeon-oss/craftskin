[package]
name = "craftskin"
version = "0.5.3"
edition = "2021"
license = "MIT"
description = "Rust source injector for FilmCraft with Appearance-page CraftSkin settings"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
